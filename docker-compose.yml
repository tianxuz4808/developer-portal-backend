services:
  developer-portal-backend:
    build: .
    image: developer-portal
    ports:
      - "8080:8080"
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      dynamodb-local:
        condition: service_healthy

  developer-portal-debug:
    build: .
    image: developer-portal-debug
    command:
      - dlv
      - exec
      - /developer-portal-backend
      - --headless
      - --listen=:40000
      - --api-version=2
      - --accept-multiclient
    ports:
      - "9080:8080"
      - "40000:40000"
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    # these 2 are required to allow delve to debug inside a docker container
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    ## depends_on: 
    ##   dynamodb-local:
    ##     condition: service_healthy
  dynamodb-local:
    build: ./dynamodb_local_latest
    image: dynamodb_local
    healthcheck:
      test: ["CMD-SHELL", "sleep 0.2 || exit 0"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

volumes:
  dynamodb_data:
